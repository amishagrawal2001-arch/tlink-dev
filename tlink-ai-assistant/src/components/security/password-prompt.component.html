<div class="password-prompt">
    <div class="prompt-header">
        <i class="fa fa-lock"></i>
        <h3>Password Required</h3>
    </div>
    <div class="prompt-content">
        <p>Please enter your password to perform this high‑risk action:</p>
        <input type="password" class="form-control" [(ngModel)]="password" (keydown.enter)="submit()" placeholder="Enter password"
            #passwordInput>
        <div *ngIf="errorMessage" class="error-message">
            <i class="fa fa-exclamation-circle"></i>
            {{ errorMessage }}
        </div>
    </div>
    <div class="prompt-footer">
        <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary" (click)="submit()" [disabled]="!password">Confirm</button>
    </div>
</div>
