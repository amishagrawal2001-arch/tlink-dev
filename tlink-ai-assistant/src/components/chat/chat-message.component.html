<div class="chat-message"
     [ngClass]="{
         'user-message': isUserMessage(),
         'assistant-message': isAssistantMessage(),
         'system-message': isSystemMessage(),
         'grouped': isGrouped,
         'with-avatar': showAvatar
     }"
     (click)="onMessageClick()">

    <!-- 头像 -->
    <div *ngIf="showAvatar" class="message-avatar">
        <div *ngIf="isUserMessage()" class="avatar user">
            <i class="icon-user"></i>
        </div>
        <div *ngIf="isAssistantMessage()" class="avatar assistant">
            <i class="icon-bot"></i>
        </div>
        <div *ngIf="isSystemMessage()" class="avatar system">
            <i class="icon-info"></i>
        </div>
    </div>

    <!-- 消息内容 -->
    <div class="message-content">
        <div class="message-bubble">
            <!-- 用户消息 -->
            <div *ngIf="isUserMessage()" class="message-text">
                {{ message.content }}
            </div>

            <!-- AI消息 -->
            <div *ngIf="isAssistantMessage()" class="message-text ai-response">
                <pre>{{ message.content }}</pre>
            </div>

            <!-- 系统消息 -->
            <div *ngIf="isSystemMessage()" class="message-text system">
                <i class="icon-warning"></i>
                {{ message.content }}
            </div>

            <!-- 操作按钮（仅AI消息显示） -->
            <div *ngIf="isAssistantMessage()" class="message-actions">
                <button class="action-btn" (click)="copyMessage()" title="Copy">
                    <i class="icon-copy"></i>
                </button>
                <button class="action-btn" (click)="regenerateResponse()" title="Regenerate">
                    <i class="icon-refresh"></i>
                </button>
                <button class="action-btn" (click)="markAsHelpful()" title="Helpful">
                    <i class="icon-thumbs-up"></i>
                </button>
                <button class="action-btn" (click)="markAsNotHelpful()" title="Not helpful">
                    <i class="icon-thumbs-down"></i>
                </button>
            </div>
        </div>

        <!-- 时间戳 -->
        <div *ngIf="showTimestamp" class="message-time">
            {{ formatTime(message.timestamp) }}
        </div>

        <!-- Token-usage footer — shown only when the provider streamed
             usage stats with `message_end`. OpenAI, Groq, OpenAI-compat,
             vLLM (with stream_options.include_usage) and Anthropic (via
             message_delta.usage) all populate this. Lets the user see
             at a glance how big this turn was, and how much it cost. -->
        <div *ngIf="message.metadata?.usage" class="message-usage"
             [title]="'prompt: ' + message.metadata.usage.promptTokens + ' tokens · completion: ' + message.metadata.usage.completionTokens + ' tokens'">
            <i class="icon-zap"></i>
            {{ message.metadata.usage.totalTokens }} tokens
            <span class="message-usage-detail">
                ({{ message.metadata.usage.promptTokens }} in · {{ message.metadata.usage.completionTokens }} out)
            </span>
            <!-- Cost surfaces only for cloud providers we have pricing
                 for. Self-hosted (vLLM/Ollama/Tabby) return $0 and the
                 helper returns empty string, hiding the dot+price. -->
            <span class="message-usage-cost" *ngIf="getFormattedCost()">
                · <strong>{{ getFormattedCost() }}</strong>
            </span>
        </div>
    </div>
</div>
