<div class="chat-input-container">
    <!-- 输入区域 -->
    <div class="input-wrapper">
        <textarea #textInput class="chat-textarea" [(ngModel)]="inputValue" [placeholder]="placeholder"
            [disabled]="disabled" (keydown)="onKeydown($event)" (input)="onInput($event)"
            (compositionstart)="onCompositionStart()" (compositionend)="onCompositionEnd()" rows="1">
        </textarea>

        <!-- 字符计数 -->
        <div class="char-counter" [ngClass]="{
            'warning': isNearLimit() && !isOverLimit(),
            'error': isOverLimit()
        }">
            {{ getCharCount() }} / {{ getCharLimit() }}
        </div>
    </div>

    <!-- 操作按钮 -->
    <div class="input-actions">
        <!-- 清空按钮 -->
        <button *ngIf="inputValue && !disabled && !streaming" class="btn-icon" (click)="clear()" title="Clear">
            <i class="fa fa-times"></i>
        </button>

        <!-- Stop button — replaces Send while a stream is in flight.
             Plumbing: chat-interface.streamingActive flag → [streaming]
             input → (stop) emits → chat-interface aborts the active
             AbortController → all providers tear down their HTTP
             requests promptly via the createLinkedAbortController link. -->
        <button *ngIf="streaming" class="btn-stop" (click)="onStop()" title="Stop generating">
            <i class="fa fa-stop"></i>
            <span class="btn-text">Stop</span>
        </button>

        <!-- 发送按钮 -->
        <button *ngIf="!streaming" class="btn-send" [disabled]="!inputValue.trim() || disabled || isOverLimit()" (click)="submit()"
            title="Send (Enter)">
            <i class="fa fa-paper-plane"></i>
            <span class="btn-text">Send</span>
        </button>
    </div>

    <!-- 帮助提示 -->
    <div class="input-hints">
        <span class="hint-item">
            <kbd>Enter</kbd> Send
        </span>
        <span class="hint-item">
            <kbd>Shift + Enter</kbd> New line
        </span>
        <span class="hint-item" *ngIf="isNearLimit()">
            <i class="fa fa-exclamation-triangle"></i>
            Near character limit
        </span>
    </div>
</div>
