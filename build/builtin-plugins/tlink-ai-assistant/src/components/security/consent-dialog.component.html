<div class="consent-dialog">
    <div class="dialog-header">
        <i class="fa fa-question-circle"></i>
        <h3>Confirm Execution</h3>
    </div>
    <div class="dialog-content">
        <p>Are you sure you want to execute this command?</p>
        <div class="command-preview">
            <code>{{ command }}</code>
        </div>
        <div class="checkbox-group">
            <label>
                <input type="checkbox" [(ngModel)]="rememberChoice">
                Remember my choice (don’t ask again for 30 days)
            </label>
        </div>
    </div>
    <div class="dialog-footer">
        <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary" (click)="confirm()">Execute</button>
    </div>
</div>
